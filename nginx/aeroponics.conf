# ============================================================
# Nginx Reverse Proxy — Aeroponics Smart Farm
# Production Architecture Single Entrypoint
# Rule S4-NGINX-04: WebSocket upgrade correctness
# ============================================================

upstream aero_ui {
    server aeroponics-ui:3000;
    keepalive 32;
}

upstream aero_backend {
    server aero-backend:3001;
    keepalive 32;
}

server {
    listen 6003;
    listen [::]:6003;
    server_name _;

    client_max_body_size 10M;

    # === Healthcheck endpoint for Docker / K8s / monitoring ===
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # === Next.js Internal Auth Handlers (MUST route to Next.js UI) ===
    # Hard Rule S4-AUTH-02: Next.js sets/clears httpOnly cookie session
    location = /api/set-token {
        proxy_pass http://aero_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/clear-token {
        proxy_pass http://aero_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === WebSocket — PHẢI khai báo TRƯỚC /api/ và / ===
    # Rule S4-NGINX-04: WebSocket upgrade correctness
    location /ws {
        proxy_pass http://aero_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho long-lived WS connection (24h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # === Socket.IO (Retro Compatibility Only) ===
    # Backend EventsGateway uses native WS at /ws.
    # This path is kept for backward compatibility with Socket.IO clients.
    # Rule S4-NGINX-04: proxy_buffering off to prevent long-poll delay.
    location /socket.io/ {
        proxy_pass http://aero_backend;
        proxy_http_version 1.1;

        # CRITICAL: Disable buffering for Socket.IO long-polling fallback
        proxy_buffering off;

        # WebSocket upgrade headers (needed when Socket.IO upgrades to WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho long-lived connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # === NestJS REST API ===
    location /api/ {
        proxy_pass http://aero_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers từ NestJS — không double-set ở Nginx
        proxy_pass_header Access-Control-Allow-Origin;
    }

    # === Next.js App (catch-all) ===
    location / {
        proxy_pass http://aero_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
