[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=3
lib_ldf_mode = deep
build_src_filter =
	+<*>
	-<integration/>
	-<relay_controller.cpp>
	-<schedule_manager.cpp>

lib_deps = 
	Wire
	SPI
	adafruit/RTClib@^2.1.4
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4

[env:native]
platform = native
test_build_src = true
build_flags =
	-std=c++17
	-pthread
	-DUNIT_TEST_HOST
	-DLEGACY_RELAY_SUPPORT
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# PROTOTYPE / LEGACY RELAY INTEGRATION TEST (Kept for historical validation, not part of Gateway Production path)
[env:native-integration]
platform = native
build_flags =
	-std=c++17
	-DUNIT_TEST_HOST
	-DMQTT_INTEGRATION_TARGET
build_src_filter =
	+<integration/ProductionPubSubClient.cpp>
	+<integration/production_mqtt_gate.cpp>
	+<mqtt_client.cpp>
	+<nvs_storage.cpp>
	+<schedule_manager.cpp>
	+<relay_controller.cpp>
	+<rtc_manager.cpp>
	+<FreeRTOSTaskRunner.cpp>
	+<ESPTaskWatchdog.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.4
