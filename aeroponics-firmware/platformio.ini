[platformio]
default_envs = esp32-s3-devkitc-1

# PRODUCTION GATEWAY HARDWARE ENVIRONMENT (ESP32-S3)
[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags = 
	-DCORE_DEBUG_LEVEL=3
lib_ldf_mode = deep
build_src_filter =
	+<*>
	-<integration/>
	-<prototype/>

lib_deps = 
	Wire
	SPI
	adafruit/RTClib@^2.1.4
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4

# PRODUCTION NATIVE TEST SUITE (Default regression suite testing Production Gateway domain)
[env:native]
platform = native
test_build_src = true
build_flags =
	-std=c++17
	-pthread
	-DUNIT_TEST_HOST
build_src_filter =
	+<*>
	-<integration/>
	-<prototype/>
test_filter =
	test_production
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# PROTOTYPE / LEGACY RELAY SUITE (Historical prototype validation; isolated from Production Gateway)
[env:native-prototype]
platform = native
test_build_src = true
build_flags =
	-std=c++17
	-pthread
	-DUNIT_TEST_HOST
	-DLEGACY_RELAY_SUPPORT
	-Iinclude/prototype/legacy_relay
	-Itest
build_src_filter =
	+<*>
	-<integration/>
	+<prototype/legacy_relay/>
test_filter =
	test_prototype
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# PROTOTYPE / LEGACY RELAY INTEGRATION TEST (Historical validation)
[env:native-integration]
platform = native
build_flags =
	-std=c++17
	-DUNIT_TEST_HOST
	-DMQTT_INTEGRATION_TARGET
	-DLEGACY_RELAY_SUPPORT
	-Iinclude/prototype/legacy_relay
	-Itest
build_src_filter =
	+<integration/ProductionPubSubClient.cpp>
	+<integration/production_mqtt_gate.cpp>
	+<mqtt_client.cpp>
	+<nvs_storage.cpp>
	+<prototype/legacy_relay/>
lib_deps =
	bblanchon/ArduinoJson@^7.0.4
