[platformio]
default_envs = esp32-s3-devkitc-1

# PRODUCTION GATEWAY HARDWARE ENVIRONMENT (ESP32-S3)
[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DRF_PROVISIONING_INDEPENDENT_SIGNOFF=1
lib_ldf_mode = deep
build_src_filter =
	+<*>
	-<integration/>
	-<prototype/>

lib_deps =
	Wire
	SPI
	adafruit/RTClib@^2.1.4
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4

# ESP32-S3 N16R8 bring-up profile. Keep the original environment available
# for rollback while explicitly selecting the module's 16 MB flash geometry.
[env:esp32-s3-n16r8]
extends = env:esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

# PRODUCTION NATIVE TEST SUITE (Default regression suite testing Production Gateway domain)
[env:native]
platform = native
test_build_src = true
build_flags =
	-std=c++17
	-pthread
	-DUNIT_TEST_HOST
build_src_filter =
	+<*>
	-<integration/>
	-<prototype/>
test_filter =
	test_production, test_fsm, test_crc16
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# MEGA8 NODE VALIDATION (local autonomous schedule + EEPROM adapter)
[env:atmega8-node]
platform = atmelavr
board = ATmega8
framework = arduino
build_src_filter =
	+<atmega8_node_main.cpp>
	+<rf_frame_codec.cpp>
	+<core/hmac_sha256.cpp>
	+<core/Crc16Modbus.cpp>
build_flags =
	-std=c++17
	-DATMEGA8_NODE_BUILD
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wl,--relax
	-Wl,-Map=$BUILD_DIR/firmware.map
	-flto
	-fno-exceptions
	-fno-rtti
	-fno-threadsafe-statics
	-fno-use-cxa-atexit
	-mrelax
extra_scripts = post:scripts/check_atmega8_size.py

; Physical AGU RF node profiles. Flash exactly one profile per controller.
[env:atmega8-node-4]
extends = env:atmega8-node
build_flags =
	${env:atmega8-node.build_flags}
	-DAGU_NODE_ID=4

[env:atmega8-node-5]
extends = env:atmega8-node
build_flags =
	${env:atmega8-node.build_flags}
	-DAGU_NODE_ID=5

[env:atmega8-node-6]
extends = env:atmega8-node
build_flags =
	${env:atmega8-node.build_flags}
	-DAGU_NODE_ID=6

[env:atmega8-node-7]
extends = env:atmega8-node
build_flags =
	${env:atmega8-node.build_flags}
	-DAGU_NODE_ID=7

# PROTOTYPE / LEGACY RELAY SUITE (Historical prototype validation; isolated from Production Gateway)
[env:native-prototype]
platform = native
test_build_src = true
build_flags =
	-std=c++17
	-pthread
	-DUNIT_TEST_HOST
	-DLEGACY_RELAY_SUPPORT
	-Iinclude/prototype/legacy_relay
	-Itest
build_src_filter =
	+<*>
	-<integration/>
	+<prototype/legacy_relay/>
test_filter =
	test_prototype
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# PRODUCTION GATEWAY MQTT INTEGRATION TEST (Real Mosquitto integration)
[env:native-integration]
platform = native
build_flags =
	-std=c++17
	-DUNIT_TEST_HOST
	-DMQTT_INTEGRATION_TARGET
	-Itest
build_src_filter =
	+<integration/ProductionPubSubClient.cpp>
	+<integration/production_mqtt_gate.cpp>
	+<mqtt_client.cpp>
	+<nvs_storage.cpp>
	+<node_registry.cpp>
	+<pump_node_controller.cpp>
	+<flow_fault_evaluator.cpp>
	+<rf_frame_codec.cpp>
	+<rf_provisioning.cpp>
	+<telemetry_analytics.cpp>
	+<group_scheduler.cpp>
	+<group_schedule_manager.cpp>
	+<core/hmac_sha256.cpp>
	+<core/Crc16Modbus.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.4

# PROTOTYPE / LEGACY RELAY INTEGRATION TEST (Historical validation)
[env:native-prototype-integration]
platform = native
build_flags =
	-std=c++17
	-DUNIT_TEST_HOST
	-DMQTT_INTEGRATION_TARGET
	-DLEGACY_RELAY_SUPPORT
	-Iinclude/prototype/legacy_relay
	-Itest
build_src_filter =
	+<integration/ProductionPubSubClient.cpp>
	+<prototype/legacy_relay/integration/legacy_mqtt_gate.cpp>
	+<prototype/legacy_relay/legacy_relay_profile_repository.cpp>
	+<mqtt_client.cpp>
	+<nvs_storage.cpp>
	+<node_registry.cpp>
	+<pump_node_controller.cpp>
	+<flow_fault_evaluator.cpp>
	+<rf_frame_codec.cpp>
	+<rf_provisioning.cpp>
	+<telemetry_analytics.cpp>
	+<group_scheduler.cpp>
	+<group_schedule_manager.cpp>
	+<prototype/legacy_relay/>
	+<core/hmac_sha256.cpp>
	+<core/Crc16Modbus.cpp>
lib_deps =
	bblanchon/ArduinoJson@^7.0.4
