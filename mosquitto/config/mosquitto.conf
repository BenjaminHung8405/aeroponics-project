# ==============================================================================
# Aeroponics Lean — Mosquitto MQTT Broker Configuration (v2.0+)
# ==============================================================================

# === Listeners ===
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# === Security Rules ===
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# === Persistence ===
persistence true
persistence_location /mosquitto/data/

# === Logging ===
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

# === Reliability & Resource Guarding Limits ===
max_connections 20
max_inflight_messages 10
max_queued_messages 100
message_size_limit 16384
retain_available true
