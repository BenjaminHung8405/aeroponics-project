name: aeroponics

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aero_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-aeroponics}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aero_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-aeroponics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # NOTE: Port 5432 KHÔNG expose ra host — internal only

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aero_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-11883}:1883"
      - "${MQTT_WS_PORT:-19001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - aero_net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u ${MQTT_ADMIN_USER} -P ${MQTT_ADMIN_PASS} -t '$$SYS/health' -m 'ping' -q 0 2>/dev/null && echo OK"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  aero-backend:
    image: aeroponics/backend:latest
    container_name: aero_backend
    build:
      context: ./aeroponics-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@timescaledb:5432/${DB_NAME:-aeroponics}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_BACKEND_USER}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      TUYA_DEVICE_IP: ${TUYA_DEVICE_IP}
      TUYA_DEVICE_ID: ${TUYA_DEVICE_ID}
      TUYA_LOCAL_KEY: ${TUYA_LOCAL_KEY}
      TUYA_SENSOR_ID: ${TUYA_SENSOR_ID:-ph-w218-01}
      TUYA_ON_DEMAND_TIMEOUT_MS: ${TUYA_ON_DEMAND_TIMEOUT_MS:-5000}
      PORT: 3001
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - aero_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  aeroponics-ui:
    image: aeroponics/ui:latest
    container_name: aero_ui
    build:
      context: ./aeroponics-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_BACKEND_URL: http://aero-backend:3001
    depends_on:
      - aero-backend
    networks:
      - aero_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  proxy:
    image: nginx:alpine
    container_name: aero_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-6003}:80"
    volumes:
      - ./nginx/aeroponics.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aeroponics-ui
      - aero-backend
    networks:
      - aero_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aero_net:
    driver: bridge
    name: aero_net

volumes:
  timescale_data:
    name: aero_timescale_data
  mosquitto_data:
    name: aero_mosquitto_data
